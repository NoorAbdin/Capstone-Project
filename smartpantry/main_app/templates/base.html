{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Smart Pantry{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block head %}{% endblock %}
</head>
<body>
    <!-- 🌿 Navbar -->
    <nav>
        <div class="nav-left">
            <a href="{% url 'home' %}" class="logo"> Smart Pantry</a>
        </div>
        <div class="nav-right">
            {% if user.is_authenticated %}
                <a href="#">My Pantry</a>
                <form action="{% url 'logout' %}" method="post" style="display:inline;">
    {% csrf_token %}
    <button type="submit">Logout</button>
</form>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'register' %}">Register</a>
            {% endif %}
        </div>
    </nav>

    <!-- 🧾 Main Content -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- 🌿 Footer -->
    <footer>
        <p>© 2025 Smart Pantry. All rights reserved.</p>
    </footer>
</body>
</html>
